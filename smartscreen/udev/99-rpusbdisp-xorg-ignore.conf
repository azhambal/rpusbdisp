# Keep the RoboPeak panel's touchscreen out of X11's pointer stack.
#
# The kernel driver registers it as a generic absolute-axis input device, so X
# happily adopts it as a second pointer and every tap on the panel clicks the
# desktop underneath the cursor.  ccdisp.clock reads the evdev node directly, so
# ignoring the device here costs us nothing.
#
# Installed to /etc/X11/xorg.conf.d/ by install-udev.sh.  The matching udev rule
# sets LIBINPUT_IGNORE_DEVICE for the same purpose on hotplug; this file is what
# covers a device X has already taken, and survives a restart either way.

Section "InputClass"
    Identifier  "RoboPeak USB Display touchscreen (ignore)"
    MatchProduct "RoboPeakUSBDisplayTS"
    Option      "Ignore" "on"
EndSection
